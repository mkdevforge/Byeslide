<section class="slide">
  <h2 class="heading">A question with one right answer?</h2>
  <!-- Give the right choice "fragment is-correct" and the answer the same data-fragment-index: both appear on one click, and the other choices fade. -->
  <div class="choices choices--text" style="--choices: 2;">
    <div class="choice"><span class="choice__letter">A</span><span>A wrong answer pupils often give</span></div>
    <div class="choice fragment is-correct" data-fragment-index="0"><span class="choice__letter">B</span><span>The right answer</span></div>
    <div class="choice"><span class="choice__letter">C</span><span>Another common mistake</span></div>
    <div class="choice"><span class="choice__letter">D</span><span>An answer that is nearly right</span></div>
  </div>
  <p class="answer fragment sunrise push-down" data-fragment-index="0"><span class="answer__tag">B</span><span>Why B is right, in one sentence.</span></p>
  <aside class="notes">Pupils hold up fingers for A to D. Ask a pupil who chose each wrong answer what they were thinking, then click.</aside>
</section>
