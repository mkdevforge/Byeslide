<section class="slide slide--bleed" data-background-color="var(--color-text)">
  <canvas class="three-scene" data-sheets aria-label="Describe what the 3D scene shows"></canvas>
  <div class="three-overlay">
    <h2 class="heading" style="color: var(--color-paper);">A 3D scene that fills the slide</h2>
    <p class="body-copy" style="color: color-mix(in srgb, var(--color-paper) 78%, transparent);">Keep the text short and away from the busy part of the scene.</p>
  </div>
  <script type="module" src="./assets/sheets-scene.js"></script>
  <aside class="notes">Copy assets/sheets-scene.js to a new module for your scene. It imports Three.js from assets/vendor/, so the slide works offline. Render only while the slide is shown.</aside>
</section>
