<section class="slide">
  <div class="split split--center" style="--split-left: 1.45fr; --split-right: 0.55fr;">
    <div class="media-frame">
      <video autoplay muted loop playsinline preload="auto" data-autoplay poster="./assets/live-reload.jpg">
        <source src="./assets/live-reload.webm" type="video/webm">
      </video>
    </div>
    <div class="column">
      <h2 class="subheading">Say what to watch for</h2>
      <p class="body-copy soft">Then play the clip. Keep it under a minute.</p>
    </div>
  </div>
  <aside class="notes">Put the clip in assets/ so the deck works offline. Reveal plays it when the slide opens and pauses it when you leave.</aside>
</section>
