<section class="slide">
  <h2 class="heading">Show commands as they are typed</h2>
  <!-- Each .typed line appears one character at a time. Set --chars to the length of the line plus 2. -->
  <pre class="terminal"><span class="cmd fragment typed" style="--chars: 15;">npm run build</span><span class="out fragment">Built in 1.2s</span><span class="cmd fragment typed" style="--chars: 14;">npm run test</span><span class="ok fragment">All tests passed</span></pre>
  <aside class="notes">Show real commands and real output. Keep lines short enough to read.</aside>
</section>
