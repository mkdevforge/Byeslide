<section class="slide" data-auto-animate>
  <!--
    Auto-animate needs two slide files next to each other, both with data-auto-animate.
    Elements with the same data-id move and resize from the first slide to the second.
    Copy this into two files, then change the layout of the second one.
  -->
  <div class="split split--center">
    <h2 class="heading" data-id="aa-heading">A heading that moves</h2>
    <pre class="listing" data-id="aa-box"><span class="t-content" data-id="aa-words">These words</span> fly to their new place.</pre>
  </div>
  <aside class="notes">On the next slide, the heading and the box move and resize instead of cutting.</aside>
</section>
