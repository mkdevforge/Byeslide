<section class="slide" id="waterfall">
  <nav class="tracker" data-tracker aria-label="Sections"></nav>
  <h2 class="action-title">An action title that names the step that moved the total most</h2>
  <figure class="exhibit">
    <p class="exhibit__head"><span class="exhibit__label">Exhibit <span data-exhibit-number></span></span>Measure, from start to end, unit</p>
    <div class="chart">
      <canvas data-pattern-bridge aria-label="Describe the bridge: start, each step, end"></canvas>
      <!-- One empty fragment per step between the totals: each click adds the next bar. -->
      <span class="fragment" data-step></span>
      <span class="fragment" data-step></span>
    </div>
  </figure>
  <footer class="footer"><p class="footer__source">Source: name the system. Say where the axis starts if it is not zero.</p><p class="footer__page" data-page-number></p></footer>
  <script src="./assets/acme-deck.js"></script>
  <script src="./assets/vendor/chart.umd.js"></script>
  <script src="./assets/acme-charts.js"></script>
  <script>
    (() => {
      const slide = window.Byeslide?.slideForScript(document.currentScript);
      const canvas = slide?.querySelector("[data-pattern-bridge]");
      if (!slide || !canvas || !window.AcmeCharts || canvas.dataset.chartReady === "true") {
        return;
      }
      const colors = window.AcmeCharts.theme();
      // The steps must add up to end minus start. key: true marks the step that matters.
      const steps = [{ label: "Start", value: 10, total: true }, { label: "Step up", value: 3, key: true }, { label: "Step down", value: -1 }, { label: "End", value: 12, total: true }];
      let level = 0;
      const ranges = steps.map((step) => {
        const start = step.total ? 0 : level;
        level = step.total ? step.value : level + step.value;
        return [start, level];
      });
      const fragments = Array.from(slide.querySelectorAll("[data-step]"));
      const shown = (i) => steps[i].total || i <= fragments.filter((f) => f.classList.contains("visible")).length;
      const data = () => ranges.map((range, i) => (shown(i) ? range : [range[0], range[0]]));
      const sign = (value) => (value > 0 ? "+" : "−");
      const chart = window.AcmeCharts.create(canvas, {
        type: "bar",
        data: {
          labels: steps.map((step) => step.label),
          datasets: [{
            data: data(),
            borderSkipped: false,
            backgroundColor: steps.map((step) => (step.key ? colors.accent : step.total ? colors.navy : step.value > 0 ? colors.blue1 : colors.blue3)),
            valueLabels: (_range, i) => (!shown(i) ? "" : steps[i].total ? String(steps[i].value) : `${sign(steps[i].value)}${Math.abs(steps[i].value)}`)
          }]
        },
        options: { datasets: { bar: { categoryPercentage: 0.6 } }, scales: { x: { grid: { display: false }, ticks: { color: colors.navy } }, y: { min: 0, max: 16 } } }
      });
      new MutationObserver(() => {
        chart.data.datasets[0].data = data();
        chart.update("none");
      }).observe(slide, { attributes: true, subtree: true, attributeFilter: ["class"] });
    })();
  </script>
  <aside class="notes">Show start and end, then one step per click. Name the cause of each step.</aside>
</section>
