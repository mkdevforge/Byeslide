<section class="slide" id="matrix">
  <nav class="tracker" data-tracker aria-label="Sections"></nav>
  <h2 class="action-title">An action title that names what lands in the top-right quadrant</h2>
  <figure class="exhibit">
    <p class="exhibit__head"><span class="exhibit__label">Exhibit <span data-exhibit-number></span></span>Items by the two measures that matter</p>
    <div class="matrix-layout">
      <div class="matrix" aria-label="Describe where each numbered item sits">
        <p class="matrix__axis matrix__axis--y"><span>Lower</span><b>Second measure</b><span>Higher</span></p>
        <div class="matrix__plot">
          <p class="matrix__quadrant">Top left</p>
          <p class="matrix__quadrant is-hot">Top right: act now</p>
          <p class="matrix__quadrant">Bottom left</p>
          <p class="matrix__quadrant">Bottom right</p>
          <!-- --x and --y place each marker, from 0 to 100, measured from the bottom left. -->
          <span class="marker is-key" style="--x: 78; --y: 80;">1</span>
          <span class="marker" style="--x: 30; --y: 70;">2</span>
          <span class="marker" style="--x: 70; --y: 28;">3</span>
        </div>
        <p class="matrix__axis matrix__axis--x"><span>Lower</span><b>First measure</b><span>Higher</span></p>
      </div>
      <table class="table">
        <thead><tr><th scope="col"></th><th scope="col">Item and owner</th><th scope="col">Response</th></tr></thead>
        <tbody>
          <tr class="is-key-row"><td><span class="marker is-key">1</span></td><td><strong>The item that matters</strong><br><span class="soft">Owner, role</span></td><td>What we do about it</td></tr>
          <tr><td><span class="marker">2</span></td><td><strong>Another item</strong><br><span class="soft">Owner, role</span></td><td>What we do about it</td></tr>
          <tr><td><span class="marker">3</span></td><td><strong>A third item</strong><br><span class="soft">Owner, role</span></td><td>What we do about it</td></tr>
        </tbody>
      </table>
    </div>
  </figure>
  <footer class="footer"><p class="footer__source">Source: name the register or assessment, and its date.</p><p class="footer__page" data-page-number></p></footer>
  <script src="./assets/acme-deck.js"></script>
  <aside class="notes">Start with the top-right quadrant. Up to six items fit.</aside>
</section>
