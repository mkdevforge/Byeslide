<section class="slide">
  <h2 class="headline">A headline that states what the chart shows</h2>
  <div class="chart">
    <canvas data-pattern-chart aria-label="Describe the chart and its key values"></canvas>
    <!-- Pinned to point 3 of dataset 1 (Actual). Move data-at to the point that matters. -->
    <div class="chart-note" data-at="3" data-dataset="1">
      <p class="chart-note__text"><strong>The number that matters</strong><span>Why it moved</span></p>
    </div>
  </div>
  <p class="source">Source: name the system and the date of the data.</p>
  <script src="./assets/vendor/chart.umd.js"></script>
  <script src="./assets/acme-charts.js"></script>
  <script>
    (() => {
      const slide = window.Byeslide?.slideForScript(document.currentScript);
      const canvas = slide?.querySelector("[data-pattern-chart]");
      if (!slide || !canvas || !window.AcmeCharts || canvas.dataset.chartReady === "true") {
        return;
      }
      const colors = window.AcmeCharts.theme();
      const plan = [10, 12, 14, 16];
      const actual = [11, 13, 13.5, 13];
      // For columns, use type "bar" and give the bar that matters colors.accent.
      window.AcmeCharts.create(canvas, {
        type: "line",
        data: {
          labels: ["Q1", "Q2", "Q3", "Q4"],
          datasets: [
            { label: "Plan", data: plan, borderColor: colors.compare, borderDash: [14, 12], borderWidth: 4, endLabel: "Plan" },
            // The end label names the line. Value labels sit away from the plan line and skip the last point.
            { label: "Actual", data: actual, borderColor: colors.ink, endLabel: "Actual", valueLabels: (value, index) => (index < 3 ? { text: String(value), below: value < plan[index] } : "") }
          ]
        },
        options: {
          layout: { padding: { right: 140 } },
          scales: { x: { grid: { display: false } }, y: { min: 0, max: 20, ticks: { stepSize: 5 } } }
        }
      });
    })();
  </script>
  <aside class="notes">Say the answer before you explain the chart. Replace the labels and data in the script, and the words in the note.</aside>
</section>
