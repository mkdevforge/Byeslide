<section class="slide slide--dark" id="section" data-section="Section name" data-background-color="var(--color-navy)">

    <div>
      <p class="divider__number">1</p>
      <h2 class="divider__title">Section name</h2>
      <p class="divider__lead">The question this section answers, in one sentence.</p>
    </div>

      <li><span>First page in this section</span><span data-page-of="chart-takeaway"></span></li>
      <li><span>Second page in this section</span><span data-page-of="chart-callouts"></span></li>
    </ol>
  </div>
  <nav class="tracker tracker--dark" data-tracker aria-label="Sections"></nav>

</section>
